<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<body>
<!-- pagina 500 sale cuando pasa un error que no controle (alguna excepcion inesperada) -->
<!--  spring boot la encuentra solo por estar entemplates/error -->
<div th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, ~{::script})}">

    <title>Error</title>

    <main class="flex flex-col items-center justify-center py-24 text-center">
        <h1 class="text-3xl font-bold text-gray-900">Ha ocurrido un error</h1>
        <p class="mt-2 text-gray-500">Lo lamentamos, un error inesperado ha ocurrido.</p>
        <a th:href="@{/}"
           class="mt-6 inline-flex items-center gap-2 rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-blue-700">
            Ir a Inicio
        </a>
    </main>

    <script></script>

</div>
</body>

</html>
