<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrito de Compra</title>
</head>
<body>
<!-- pagina del carrito igual que las otras se mete dentro del layout -->
<div th:replace="~{fragments/layout :: layout(~{::title}, ~{::main}, ~{::script})}">
    <title> Carrito de Compra</title>


    <main>
        <div class="mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 sm:text-3xl">Carrito de Compra</h1>
                <p class="mt-1 text-gray-500">Revisa tus productos antes de continuar</p>
            </div>
            <a th:href="@{/}"
               class="inline-flex items-ceenter gap-2 rounded-lg border bordeer-gray-300 bg-white px-4 py-2 txt-sm font-medium text-gray-700 hover:bg-hray-50">
               <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                   <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
               </svg>
                Seguir Comprando
            </a>
        </div>
        <!-- si el carrito esta vacio sale este mensaje -->
        <div th:if="${#lists.isEmpty(productos)}"
             class="rounded-lg border border-dashed border-gray-300 bg-white p-12 text-center text-gray-500">
            Tu carrito de compra está vacío.
        </div>

        <!-- si si hay productos muestro la tabla -->
        <div th:if="${not #lists.isEmpty(productos)}" class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
            <!-- boton de vaciar, data-confirm hace que el js pregunte antes de borrar todo -->
            <div class="flex items-center justify-end border-b border-gray-200 p-4">
                <a id="ancVaciarCarrito" th:href="@{/carrito/vaciar}" data-confirm="¿Desea vaciar el carrito de compra?"
                   class="inline-flex items-center gap-2 rounded-lg border border-red-200 bg-red-50 px-3 py-1.5 text-sm font-medium text-red-700 transition hover:bg-red-100">
                    Vaciar carrito
                </a>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-50 text-xs uppercase text-gray-500">
                    <tr>
                        <th class="px-4 py-3"></th>
                        <th class="px-4 py-3">Nombre</th>
                        <th class="px-4 py-3">Código</th>
                        <th class="px-4 py-3">Cantidad</th>
                        <th class="px-4 py-3">Precio</th>
                        <th class="px-4 py-3">Sub Total</th>
                        <th class="px-4 py-3"></th>
                    </tr>
                    </thead>
                    <!-- una fila por cada producto cada uno es un ItemCarritoDTO -->
                    <!-- el subtotal ya viene calculado del service -->
                    <tbody class="divide-y divide-gray-100">
                    <tr th:each="producto : ${productos}" class="hover:bg-gray-50">
                        <td class="px-4 py-3">
                            <img th:src="@{'/' + ${producto.imagen}}" th:alt="${producto.nombre}"
                                 class="h-12 w-12 rounded-lg object-cover" />
                        </td>
                        <td class="px-4 py-3 font-medium text-gray-900" th:text="${producto.nombre}"></td>
                        <td class="px-4 py-3 text-gray-500" th:text="${producto.codigo}"></td>
                        <td class="px-4 py-3" th:text="${producto.cantidad}"></td>
                        <td class="px-4 py-3" th:text="'Q' + ${producto.precio}"></td>
                        <td class="px-4 py-3 font-semibold text-gray-900" th:text="'Q' + ${producto.subTotal}"></td>
                        <td class="px-4 py-3 text-right">
                            <!-- link de eliminar arma la url con el id del item: /carrito/5/eliminar -->
                            <a class="font-medium text-red-600 hover:text-red-800"
                               data-confirm="¿Desea quitar este producto del carrito de compra?"
                               th:href="@{'/carrito/' + ${producto.idShoppingCart} + '/eliminar'}">Eliminar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script></script>
    </main>

</div>

</body>
</html>
