<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, script)" class="h-full">
<!-- este es el layout que comparten todas las paginas (menu, mensajes y scripts) -->
<!-- th:fragment lo declara como fragmento que recibe 3 cosas: el title, el contenido (main) y el script de cada pagina -->
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- tailwind desde el cdn para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <!-- aqui se pone el title que manda cada pagina -->
    <title th:text="${title}">Título</title>
</head>

<body class="h-full font-sans bg-gray-50 text-gray-800">
<!-- menu de arriba, sticky para que se quede pegado al hacer scroll -->
<nav class="sticky top-0 z-40 bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <!-- logo-->
            <a th:href="@{/}" class="flex items-center gap-2 text-lg font-semibold text-gray-900">
                <svg class="w-7 h-7 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.836l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 1.87-4.7 2.246-7.184a1.125 1.125 0 00-1.11-1.3H5.25M5.25 3H4.5m0 0L3.7 5.836m0 0L5.25 14.25M4.5 3l1.386 5.836" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM18.75 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
                </svg>
                Carrito Compras
            </a>
            <!-- boton del carrito -->
            <a th:href="@{/carrito}"
               class="relative inline-flex items-center gap-2 rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.836l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 1.87-4.7 2.246-7.184a1.125 1.125 0 00-1.11-1.3H5.25M5.25 3H4.5m0 0L3.7 5.836m0 0L5.25 14.25M4.5 3l1.386 5.836" />
                </svg>
                Carrito
                <!-- el numerito rojo, totalCarrito viene de GlobalModelAttributes -->
                <!-- si es 0 le agrego la clase hidden para que no salga. el js lo actualiza con el id cart-badge -->
                <span id="cart-badge"
                      class="absolute -top-2 -right-2 inline-flex h-5 w-5 items-center justify-center rounded-full bg-red-600 text-xs font-bold text-white"
                      th:text="${totalCarrito}"
                      th:classappend="${totalCarrito == 0} ? ' hidden' : ''">0</span>
            </a>
        </div>
    </div>
</nav>

<!-- aqui salen los mensajes . los del servidor salen con th:each y los del js se agregan aqui mismo -->

<div id="toast-container" class="fixed top-20 right-4 z-50 flex w-80 flex-col gap-2">
    <div th:each="mensaje : ${flashMensajes}"
         th:class="'flex items-center rounded-lg p-4 text-sm shadow ' + (${mensaje.tipo == 'error'} ? 'bg-red-50 text-red-800 border border-red-200' : (${mensaje.tipo == 'aviso'} ? 'bg-yellow-50 text-yellow-800 border border-yellow-200' : (${mensaje.tipo == 'info'} ? 'bg-blue-50 text-blue-800 border border-blue-200' : 'bg-green-50 text-green-800 border border-green-200')))"
         role="alert"
         data-flash="true"
         th:text="${mensaje.cuerpo}">
    </div>
</div>
<!-- aqui se mete el main de cada pagina (catalogo, carrito o error) -->
<main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div th:replace="${content}"></div>
</main>
<!-- scripts comunes: flowbite y mi js del carrito, y al final el script propio de cada pagina -->
<script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
<script th:src="@{/assets/js/carrito-app.js}"></script>
<th:block th:replace="${script}"></th:block>
</body>

</html>
